# SecDeploy release manifest — the suite "bill of materials".
# A suite version pins one compatible, tested set of component tags. Deploying a
# suite version gives you exactly this combination on any target.
#
# kind:     "service" (built from pinned source) | "stack" (compose deploy of upstream)
# tier:     placement tier — identity | inference | gateway | collab | edge. The site topology
#           (topology.toml) assigns each tier to a compute resource; see docs/topology.md.
# port:     primary inbound port, used to build the component's peer URL for addressing.
# optional: droppable with `secdeploy deploy <target> --without <name>` when you already
#           run that infrastructure (e.g. an existing CA or IdP).
# fronted:  true when secproxy (the edge tier) puts this HTTP service behind its :443 front
#           door instead of the component's own port — see topology.py's `is_fronted`. Never
#           set on secllm (inference must dial direct, never through the proxy), secdns (not
#           HTTP), or secproxy itself.

suite = "1.7.0"
released = "2026-08-07"
description = "SecRouter secure-AI suite"

# ── Identity & trust (optional infra) ──
[components.seccert]
repo = "secrouter/seccert"
ref = "v1.0.0"
kind = "service"
tier = "identity"
port = 47001
optional = true
runtime = "python>=3.11"
role = "internal ACME certificate authority (stands up first — issues the suite's certs)"

[components.secsso]
repo = "secrouter/secsso"
ref = "v1.1.0"
kind = "stack"
tier = "identity"
port = 9000
optional = true
fronted = true
role = "single sign-on (Authentik) — drop it when you have Okta/Entra/Keycloak"

[components.secdns]
repo = "secrouter/secdns"
ref = "v0.1.0"
kind = "service"
tier = "identity"
port = 53
optional = true
runtime = "python>=3.11"
role = "internal DNS — resolves the suite's *.internal names (drop it when you run your own DNS)"

# ── Inference ──
[components.secllm]
repo = "secrouter/secllm"
ref = "v1.1.0"
kind = "service"
tier = "inference"
port = 11400
runtime = "python>=3.11 + NVIDIA GPU"
role = "local inference — vLLM control plane (SecRouter routes to it)"

# ── Gateway ──
[components.secrouter]
repo = "secrouter/secrouter"
ref = "v1.1.0"
kind = "service"
tier = "gateway"
port = 47002
fronted = true
runtime = "node>=24"
role = "governed AI gateway"

# ── Agents & collaboration ──
[components.secagent]
repo = "secrouter/secagent"
ref = "v0.3.0"
kind = "service"
tier = "collab"
port = 47007
fronted = true
runtime = "python>=3.11"
role = "agentic harness (pi) — MR review, analysis, chat-ops"

[components.secchat]
repo = "secrouter/secchat"
ref = "v1.1.0"
kind = "stack"
tier = "collab"
port = 8065
fronted = true
role = "team chat + chat-ops (Mattermost) — bridges to SecAgent"

# The native SecChat rebuild (purpose-built auditable team + agentic chat: Node/TS + Postgres,
# tamper-evident hash chains, owner-gated agents). Meant to replace BOTH the Mattermost `secchat`
# above AND the LibreChat `secassist` below. EXPERIMENTAL: off by default — opt in with
# `--with secchatng` to deploy it alongside for evaluation. Cutover (retire Mattermost/LibreChat,
# rewire the SecAgent bridge) is a later, deliberate step. Ref tracks the rebuild branch until a
# release tag is cut.
[components.secchatng]
repo = "secrouter/secchat"
ref = "rearchitecture"
kind = "stack"
tier = "collab"
port = 47010
experimental = true
fronted = true
role = "native auditable team + agentic chat (SecChat rebuild) — transitional replacement for Mattermost + LibreChat"

[components.secassist]
repo = "secrouter/secassist"
ref = "v0.1.0"
kind = "stack"
tier = "collab"
port = 3080
fronted = true
optional = true
role = "governed AI chat UI (LibreChat) — SSO login; per-user governance via SecRouter"

[components.secrecorder]
repo = "secrouter/secrecorder"
ref = "v0.8.2"
kind = "service"
tier = "collab"
port = 47003
fronted = true
runtime = "python>=3.11"
role = "transcription (native/MLX on macOS, faster-whisper on Fedora)"

# ── Edge (optional infra) ──
[components.secproxy]
repo = "secrouter/secproxy"
ref = "v0.2.0"
kind = "service"
tier = "edge"
port = 443
optional = true
runtime = "nginx (system package)"
role = "edge reverse proxy — one HTTPS front door (:443) for the suite's web/API services"

# Deploy targets. `kind` selects the mechanism the CLI uses.
[targets.macos]
kind = "compose"
description = "MacBook Pro M-series — Docker Compose via Colima (services + stacks); SecRecorder native (MLX/Metal)"

[targets.fedora-fips]
kind = "systemd-native"
description = "FIPS-mode Fedora host — native hardened systemd services (+ Podman for stack components)"

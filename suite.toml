# SecDeploy release manifest — the suite "bill of materials".
# A suite version pins one compatible, tested set of component tags. Deploying a
# suite version gives you exactly this combination on any target.
#
# kind:     "service" (built from pinned source) | "stack" (compose deploy of upstream)
# tier:     placement tier — identity | inference | gateway | collab | edge. The site topology
#           (topology.toml) assigns each tier to a compute resource; see docs/topology.md.
# port:     primary inbound port, used to build the component's peer URL for addressing.
# optional: droppable with `secdeploy deploy <target> --without <name>` when you already
#           run that infrastructure (e.g. an existing CA or IdP).
# fronted:  true when secproxy (the edge tier) puts this HTTP service behind its :443 front
#           door instead of the component's own port — see topology.py's `is_fronted`. Never
#           set on secllm (inference must dial direct, never through the proxy), secdns (not
#           HTTP), or secproxy itself.

suite = "2.0.0"
released = "2026-08-10"
description = "SecRouter secure-AI suite"

# ── Identity & trust (optional infra) ──
[components.seccert]
repo = "secrouter/seccert"
ref = "v1.0.0"
kind = "service"
tier = "identity"
port = 47001
optional = true
runtime = "python>=3.11"
role = "internal ACME certificate authority (stands up first — issues the suite's certs)"

[components.secsso]
repo = "secrouter/secsso"
# main — carries the secchatng OIDC blueprint + the redirect-env passthrough (promoted from the
# rearchitecture rebuild branch). Repin to a secsso release tag at the next suite release.
ref = "main"
kind = "stack"
tier = "identity"
port = 9000
optional = true
fronted = true
role = "single sign-on (Authentik) — drop it when you have Okta/Entra/Keycloak"

[components.secdns]
repo = "secrouter/secdns"
ref = "v0.1.0"
kind = "service"
tier = "identity"
port = 53
optional = true
runtime = "python>=3.11"
role = "internal DNS — resolves the suite's *.internal names (drop it when you run your own DNS)"

# ── Inference ──
[components.secllm]
repo = "secrouter/secllm"
# main (post-v1.1.0): the integrated superset — native Apple-Silicon MLX backend (the `mlx`
# extra + backends/mlx_server.py + mlx_model catalog quants), the admin Download button
# (decoupled from Load) with live download-progress, concurrent multi-model serving
# (max_loaded=0 default: models coexist without eviction), and API-call tracking. Required for
# real local inference on macOS — v1.1.0 has only the vllm/mock backends. Re-pin to a tag once cut.
ref = "main"
kind = "service"
tier = "inference"
port = 11400
runtime = "python>=3.11 + NVIDIA GPU"
role = "local inference — vLLM control plane (SecRouter routes to it)"

# ── Gateway ──
[components.secrouter]
repo = "secrouter/secrouter"
ref = "v1.1.0"
kind = "service"
tier = "gateway"
port = 47002
fronted = true
runtime = "node>=24"
role = "governed AI gateway"

# ── Agents & collaboration ──
[components.secagent]
repo = "secrouter/secagent"
# main until a bridge-free release tag is cut — the standing chat bridge was removed at the
# SecChat cutover (secagent is now an installed on-demand pi harness, not a chat service). Repin
# to a secagent release tag at the next suite release, alongside secchat/secsso.
ref = "main"
kind = "service"
tier = "collab"
# No standing inbound listener: secagent is INSTALLED as an on-demand pi harness (MR review, code
# analysis, testgen, docs — driven by CLI / CI / MCP), not run as a persistent fronted service —
# so no port and not fronted.
runtime = "python>=3.11"
role = "pi agentic harness — MR review, code analysis, testgen, docs (CLI / CI / MCP)"

# The native SecChat — purpose-built auditable team + agentic chat (Node/TS + Postgres,
# tamper-evident hash chains, owner-gated agents). This is now the canonical chat component: the
# native rebuild that replaced BOTH prior chat components (team chat and governed AI chat) in one
# app. Its SSO client id in SecSSO stays `secchatng` (the retained Authentik client — users only
# ever see "SecChat"). Ref tracks `main` until a release tag is cut — repin to a secchat release
# tag at the next suite release, alongside secsso.
[components.secchat]
repo = "secrouter/secchat"
ref = "main"
kind = "stack"
tier = "collab"
port = 47010
fronted = true
role = "native auditable team + agentic chat — SSO login, tamper-evident audit, owner-gated agents"

[components.secrecorder]
repo = "secrouter/secrecorder"
ref = "v0.8.2"
kind = "service"
tier = "collab"
port = 47003
fronted = true
runtime = "python>=3.11"
role = "transcription (native/MLX on macOS, faster-whisper on Fedora)"

# ── Edge (optional infra) ──
[components.secproxy]
repo = "secrouter/secproxy"
ref = "v0.2.0"
kind = "service"
tier = "edge"
port = 443
optional = true
runtime = "nginx (system package)"
role = "edge reverse proxy — one HTTPS front door (:443) for the suite's web/API services"

# Deploy targets. `kind` selects the mechanism the CLI uses.
[targets.macos]
kind = "compose"
description = "MacBook Pro M-series — Docker Compose via Colima (services + stacks); SecRecorder native (MLX/Metal)"

[targets.fedora-fips]
kind = "systemd-native"
description = "FIPS-mode Fedora host — native hardened systemd services (+ Podman for stack components)"

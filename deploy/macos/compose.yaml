# SecRouter suite — macOS (Apple Silicon) eval stack via Docker Compose (Colima).
# SecCert + SecRouter run as containers; SecRecorder runs natively (MLX/Metal — see the runbook).
# Images are built by `secdeploy build macos` from the pinned checkouts under ../../work/.
name: secsuite

services:
  seccert:
    image: secrouter/seccert:${SECSUITE_VERSION:-1.0.0}
    build:
      context: ../../work/seccert
    environment:
      SECCERT_HOST: "0.0.0.0"
      SECCERT_PORT: "47001"
      SECCERT_EXTERNAL_URL: http://localhost:47001
      SECCERT_ADMIN_TOKEN: ${SECCERT_ADMIN_TOKEN:-dev-admin-token}
      # HTTP-01 validation target: certbot's standalone responder runs on the host
      # (unprivileged port), reached from this container via host.docker.internal.
      SECCERT_HTTP01_PORT: "47080"
    volumes:
      - seccert-data:/var/lib/seccert
    ports:
      - "47001:47001"   # ACME directory + console at http://localhost:47001/admin
    restart: unless-stopped

  secrouter:
    image: secrouter/secrouter:${SECSUITE_VERSION:-1.0.0}
    build:
      context: ../../work/secrouter
    # The generated peer-wiring env (SECROUTER_SECLLM_ENDPOINTS/_TOKEN, SECAGENT_URL, etc. —
    # see wiring.write_addressing) — deploy() writes this BEFORE bringing the container up, so
    # it's always present for a real (non-dry-run) secdeploy deploy. `required: false` so a
    # standalone `docker compose up` (no secdeploy run first) doesn't hard-fail on a missing
    # file — it just falls back to this service's own `environment:` defaults below, same as
    # before this existed. This was a real gap: SecRouter ran with ZERO topology-derived
    # config on macOS (unlike the native launchd services, which already got it) — confirmed
    # live, "auto"-model routing 502'd because SECROUTER_SECLLM_ENDPOINTS never reached the
    # container despite being correctly generated in out/addressing/env/secrouter.env.
    env_file:
      - ../../out/addressing/env/secrouter.env
    volumes:
      # SECROUTER_EGRESS_FILE (from the env_file above) is a HOST-relative path
      # (out/addressing/secrouter-egress.json) — meaningless inside the container's own
      # filesystem without this mount. Read-only: this container only ever reads it.
      # Also carries the hardened freerouter.config.json (FREEROUTER_CONFIG below) —
      # same mount, no separate bind needed.
      - ../../out/addressing:/addressing:ro
      # security.storePath (/var/lib/secrouter/secrouter.db in freerouter.config.json) —
      # the admin-override DB, usage ledger, and hash-chained audit log. Named volume so
      # it survives container recreation; without this a `docker compose up` recreate
      # silently resets accounting/audit history.
      - secrouter-data:/var/lib/secrouter
      # SecCert's root CA — lets Node verify the seccert-issued TLS cert that secproxy
      # terminates secsso.sec.internal with, instead of failing UNABLE_TO_VERIFY_LEAF_SIGNATURE
      # on the first JWKS fetch (NODE_EXTRA_CA_CERTS below). Same file/mechanism as
      # work/secchat/compose.yaml.
      - ${SUITE_CA_PATH:-../../out/seccert-root.pem}:/etc/ssl/certs/suite-ca.pem:ro
    extra_hosts:
      # security.oidc's issuer/jwksUri (out/addressing/freerouter.config.json) point at
      # secsso.sec.internal — that name only resolves via the HOST's resolver (macOS
      # /etc/resolver/sec.internal, served by SecDNS), invisible to this container the same
      # way secllm.sec.internal already is (see SECROUTER_SECLLM_ENDPOINTS below). Without
      # this, the JWKS fetch on the first authenticated request fails ENOTFOUND and every
      # request 401s. Mirrors work/secchat/compose.yaml's identical extra_hosts entry.
      - "secsso.sec.internal:host-gateway"
    environment:
      # server.ts defaults to 127.0.0.1, which is unreachable through the published
      # port — Docker's healthcheck passes because it runs inside the same container.
      SECROUTER_HOST: "0.0.0.0"
      SECROUTER_PORT: "47002"
      # Trust anchor for the seccert-issued TLS cert secproxy terminates secsso.sec.internal
      # (and every other fronted FQDN) with — see the suite-ca.pem bind above. Without this the
      # OIDC JWKS fetch to https://secsso.sec.internal/... fails
      # UNABLE_TO_VERIFY_LEAF_SIGNATURE (self-signed-from-Node's-perspective root).
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/suite-ca.pem
      # CUI-hardened config (security.enabled=true, OIDC required, egress allow-list) —
      # see out/addressing/freerouter.config.json. Explicitly hand-authors the secllm
      # provider + tier routing rather than relying on the SECROUTER_SECLLM_ENDPOINTS
      # turnkey intake below: src/config.ts's applySecllmEndpointsIntake is a no-op the
      # moment a config file defines providers.secllm, so once this is mounted the
      # SECROUTER_SECLLM_ENDPOINTS override two lines down stops driving routing (kept
      # set anyway as a harmless fallback for a plain `docker compose up` without this
      # file, or for a future FREEROUTER_CONFIG-less run).
      FREEROUTER_CONFIG: /addressing/freerouter.config.json
      # Overrides the env_file's host-relative value with the in-container mount path above
      # (environment: wins over env_file for the same key — see Compose's own precedence
      # rules). Confirmed live: without this SecRouter FATALs on boot (ENOENT) the moment
      # SECROUTER_SECLLM_ENDPOINTS is also set, since turnkey-routing to SecLLM requires this
      # file to actually authorize the egress.
      SECROUTER_EGRESS_FILE: /addressing/secrouter-egress.json
      # Overrides the env_file's secllm.sec.internal FQDN — that name only resolves on the
      # HOST (macOS's /etc/resolver/sec.internal, served by SecDNS as a native launchd
      # service), which a Docker container has no visibility into at all. SecLLM ALSO runs
      # natively on macOS (never containerized — see targets/macos.py), so it's reachable
      # from inside this container via Docker's own host.docker.internal, same mechanism
      # already used for SecCert's HTTP-01 responder above. Confirmed live: without this,
      # every request 502s "fetch failed" (DNS ENOTFOUND) despite the endpoint URL otherwise
      # being correct. Port 11400 is SecLLM's fixed manifest port (suite.toml), not derived
      # per-deploy like the FQDN was — matches this file's own SECROUTER_PORT convention of
      # hardcoding stable suite ports directly rather than templating them.
      #
      # LIMITATION: this assumes a single-host topology (this Mac IS the one SecLLM
      # instance) — the common macOS eval shape this whole compose file targets. A genuine
      # multi-instance SecLLM pool spanning OTHER resources needs real per-instance
      # reachability (some local via host.docker.internal, some remote via DNS/IP), which a
      # single static override can't express; that scenario needs hand-tuning here.
      SECROUTER_SECLLM_ENDPOINTS: http://host.docker.internal:11400/v1
    depends_on:
      - seccert
    ports:
      - "47002:47002"   # gateway (dev mode by default; mount a hardened config for real use)
    restart: unless-stopped

volumes:
  seccert-data:
  secrouter-data:

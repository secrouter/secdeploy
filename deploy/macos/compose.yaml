# SecRouter suite — macOS (Apple Silicon) eval stack via Docker Compose (Colima).
# SecCert + SecRouter run as containers; SecRecorder runs natively (MLX/Metal — see the runbook).
# Images are built by `secdeploy build macos` from the pinned checkouts under ../../work/.
name: secsuite

services:
  seccert:
    image: secrouter/seccert:${SECSUITE_VERSION:-1.0.0}
    build:
      context: ../../work/seccert
    environment:
      SECCERT_HOST: "0.0.0.0"
      SECCERT_PORT: "47001"
      SECCERT_EXTERNAL_URL: http://localhost:47001
      SECCERT_ADMIN_TOKEN: ${SECCERT_ADMIN_TOKEN:-dev-admin-token}
      # HTTP-01 validation target: certbot's standalone responder runs on the host
      # (unprivileged port), reached from this container via host.docker.internal.
      SECCERT_HTTP01_PORT: "47080"
    volumes:
      - seccert-data:/var/lib/seccert
    ports:
      - "47001:47001"   # ACME directory + console at http://localhost:47001/admin
    restart: unless-stopped

  secrouter:
    image: secrouter/secrouter:${SECSUITE_VERSION:-1.0.0}
    build:
      context: ../../work/secrouter
    # The generated peer-wiring env (SECROUTER_SECLLM_ENDPOINTS/_TOKEN, SECAGENT_URL, etc. —
    # see wiring.write_addressing) — deploy() writes this BEFORE any compose `up`, so it's
    # always present for a real (non-dry-run) secdeploy deploy, and deploy() additionally seeds
    # an empty one on the no-topology single-host path so this reference always resolves. This
    # was a real gap: SecRouter ran with ZERO topology-derived config on macOS (unlike the
    # native launchd services, which already got it) — confirmed live, "auto"-model routing
    # 502'd because SECROUTER_SECLLM_ENDPOINTS never reached the container despite being
    # correctly generated in out/addressing/env/secrouter.env.
    #
    # SHORT FORM (a bare path string), not the `{path, required:false}` long form: the long form
    # needs Docker Compose >= 2.24, and older compose plugins reject it at schema-validation time
    # ("services.secrouter.env_file.0 must be a string"), which fails the deploy on any host with
    # an older compose — before the daemon is even contacted. The short form is accepted by every
    # Compose version; deploy() guarantees the file exists first (above), so nothing is lost.
    env_file:
      - ../../out/addressing/env/secrouter.env
    volumes:
      # SECROUTER_EGRESS_FILE (from the env_file above) is a HOST-relative path
      # (out/addressing/secrouter-egress.json) — meaningless inside the container's own
      # filesystem without this mount. Read-only: this container only ever reads it.
      - ../../out/addressing:/addressing:ro
    environment:
      # server.ts defaults to 127.0.0.1, which is unreachable through the published
      # port — Docker's healthcheck passes because it runs inside the same container.
      SECROUTER_HOST: "0.0.0.0"
      SECROUTER_PORT: "47002"
      # Overrides the env_file's host-relative value with the in-container mount path above
      # (environment: wins over env_file for the same key — see Compose's own precedence
      # rules). Confirmed live: without this SecRouter FATALs on boot (ENOENT) the moment
      # SECROUTER_SECLLM_ENDPOINTS is also set, since turnkey-routing to SecLLM requires this
      # file to actually authorize the egress.
      SECROUTER_EGRESS_FILE: /addressing/secrouter-egress.json
      # Overrides the env_file's secllm.sec.internal FQDN — that name only resolves on the
      # HOST (macOS's /etc/resolver/sec.internal, served by SecDNS as a native launchd
      # service), which a Docker container has no visibility into at all. SecLLM ALSO runs
      # natively on macOS (never containerized — see targets/macos.py), so it's reachable
      # from inside this container via Docker's own host.docker.internal, same mechanism
      # already used for SecCert's HTTP-01 responder above. Confirmed live: without this,
      # every request 502s "fetch failed" (DNS ENOTFOUND) despite the endpoint URL otherwise
      # being correct. Port 11400 is SecLLM's fixed manifest port (suite.toml), not derived
      # per-deploy like the FQDN was — matches this file's own SECROUTER_PORT convention of
      # hardcoding stable suite ports directly rather than templating them.
      #
      # LIMITATION: this assumes a single-host topology (this Mac IS the one SecLLM
      # instance) — the common macOS eval shape this whole compose file targets. A genuine
      # multi-instance SecLLM pool spanning OTHER resources needs real per-instance
      # reachability (some local via host.docker.internal, some remote via DNS/IP), which a
      # single static override can't express; that scenario needs hand-tuning here.
      # TEST-INSTANCE: repointed from SecLLM (:11400 mock, no GPU on macOS) to the two local MLX
      # model servers on the host — :8081 Llama-3.2-3B (fast), :8082 Gemma-4-26B (tool-calling).
      SECROUTER_SECLLM_ENDPOINTS: http://host.docker.internal:8081/v1,http://host.docker.internal:8082/v1
      # SECROUTER_SECLLM_MODELS (the tier-tag → real-MLX-id remap) is NOT hardcoded here — it is
      # generated into out/addressing/env/secrouter.env from secsite.toml's [inference.models] (the
      # turnkey path) and loaded via this service's env_file above. Only the endpoints override
      # stays inline, because the topology's SecLLM FQDN can't name the host's MLX ports.
    depends_on:
      - seccert
    ports:
      - "47002:47002"   # gateway (dev mode by default; mount a hardened config for real use)
    restart: unless-stopped

volumes:
  seccert-data:

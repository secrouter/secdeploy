[project]
name = "secdeploy"
version = "1.1.0"
description = "SecDeploy — release train + deploy orchestration for the SecRouter suite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Austin Probe" }]
keywords = ["deploy", "release", "fips", "cmmc", "air-gapped", "secrouter", "systemd", "compose"]
dependencies = []  # stdlib only (tomllib, argparse, subprocess, hashlib, tarfile, getpass)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
secdeploy = "secdeploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secdeploy"]
